name: QuotaVadis
options:
  bundleIdPrefix: cz.zmrhal
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  QuotaCore:
    path: .
targets:
  QuotaVadis:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Apps/Mac/Resources
    dependencies:
      - package: QuotaCore
        product: QuotaCore
    info:
      path: Apps/Mac/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: QuotaVadis
        NSHumanReadableCopyright: "© 2026 Václav Zmrhal"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/QuotaVadis.entitlements
