name: QuotaVadis
options:
  bundleIdPrefix: cz.zmrhal
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 8PW5FWH7P2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
packages:
  QuotaCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.3
targets:
  QuotaVadis:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Apps/Mac/Resources
    dependencies:
      - package: QuotaCore
        product: QuotaCore
      - package: QuotaCore
        product: QuotaUI
      - package: Sparkle
        product: Sparkle
      - target: QuotaWidgets-Mac
        embed: true
      - target: quotavadis-cli
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDisplayName: QuotaVadis
        NSHumanReadableCopyright: "© 2026 Václav Zmrhal"
        SUFeedURL: https://zmrhal.cz/quotavadis/appcast.xml
        SUPublicEDKey: uchYgkRDkq9Yzq1GqgEkUCA8nOUZNdbe17zfMGzTpME=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/QuotaVadis.entitlements
    entitlements:
      path: Apps/Mac/QuotaVadis.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.cz.zmrhal.QuotaVadis]
        com.apple.security.application-groups: [group.cz.zmrhal.QuotaVadis]
  QuotaVadis-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/iOS/Sources
      - path: Apps/iOS/Resources
    dependencies:
      - package: QuotaCore
        product: QuotaCore
      - package: QuotaCore
        product: QuotaUI
      - target: QuotaWidgets-iOS
        embed: true
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: QuotaVadis
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Apps/iOS/QuotaVadis-iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.cz.zmrhal.QuotaVadis]
        aps-environment: development
        com.apple.developer.icloud-container-environment: Production
        com.apple.security.application-groups: [group.cz.zmrhal.QuotaVadis]
    settings:
      base:
        PRODUCT_NAME: QuotaVadis
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"
  quotavadis-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/quotavadis
    dependencies:
      - package: QuotaCore
        product: QuotaCore
    settings:
      base:
        # Not "quotavadis": on a case-insensitive disk it would collide with the app executable "QuotaVadis".
        PRODUCT_NAME: quotavadis-cli
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis.cli
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
  QuotaWidgets-Mac:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/Widgets/Sources
    dependencies:
      - package: QuotaCore
        product: QuotaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/Widgets/Info-Mac.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: QuotaVadis Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/Widgets/QuotaWidgets-Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.cz.zmrhal.QuotaVadis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: true
  QuotaWidgets-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/Widgets/Sources
    dependencies:
      - package: QuotaCore
        product: QuotaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/Widgets/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: QuotaVadis Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/Widgets/QuotaWidgets-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.cz.zmrhal.QuotaVadis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zmrhal.QuotaVadis.widgets
        CODE_SIGN_IDENTITY: "Apple Development"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  QuotaVadis:
    build:
      targets:
        QuotaVadis: all
    run:
      config: Debug
    archive:
      config: Release
  QuotaVadis-iOS:
    build:
      targets:
        QuotaVadis-iOS: all
    run:
      config: Debug
    archive:
      config: Release
